[project]
name = "poly-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
 dependencies = [
    "authlib>=1.6.6",
    "emails>=0.6",
    "google-auth-oauthlib>=1.0.0",
    "jinja2>=3.1.0",
    "passlib[bcrypt]>=1.7.4",
    "poly-db",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.45",
    "stripe>=14.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv.sources]
poly-db = { path = "../storage/poly-db", editable = true }
