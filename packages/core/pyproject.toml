[project]
name = "poly-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.6.6",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "emails>=0.6",
    "google-auth-oauthlib>=1.0.0",
    "jinja2>=3.1.0",
    "passlib[bcrypt]>=1.7.4",
    "poly-db",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.45",
    "stripe>=14.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[tool.uv.sources]
poly-db = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "DTZ",
    "T",
    "PGH",
    "PLC",
    "PIE",
    "SIM",
    "TID",
    "TCH",
    "ARG",
    "PTH",
    "PD",
    "ERA",
    "PLR",
    "FLY",
    "RUF",
]
ignore = [
    "E501",
    "PLR2004",
]

[tool.ruff.lint.isort]
known-first-party = ["poly_core", "poly_db"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "lf"
