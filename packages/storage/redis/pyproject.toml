[project]
name = "poly-redis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=7.0.0",
    "redis>=7.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["poly_redis*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["poly_redis"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "DTZ",
    "T",
    "PGH",
    "PLC",
    "PIE",
    "SIM",
    "TID",
    "TCH",
    "ARG",
    "PTH",
    "PD",
    "ERA",
    "PLR",
    "FLY",
    "RUF",
]
ignore = [
    "E501",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "lf"

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]
