[project]
name = "poly-script"
version = "0.1.0"
description = "Polyglot monorepo workspace"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/core",
    "packages/stt",
    "packages/storage/db",
    "packages/storage/redis",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "DTZ",
    "T",
    "PGH",
    "PLC",
    "PIE",
    "SIM",
    "TID",
    "TCH",
    "ARG",
    "PTH",
    "PD",
    "ERA",
    "PLR",
    "FLY",
    "RUF",
]
ignore = [
    "E501",
    "PLR2004",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["poly_db", "poly_core", "poly_redis", "poly_stt"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "packages/core/tests", "packages/stt/tests"]
