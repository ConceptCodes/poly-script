<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You've Been Invited to Join a Team</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h1 style="color: #4a90e2;">You've Been Invited to Join {{ team_name }}</h1>
        <p>{{ inviter_name }} has invited you to join their team on PolyScript as a {{ role }}.</p>
        <p style="margin: 20px 0;">
            <a href="{{ invitation_url }}" style="background-color: #4a90e2; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; display: inline-block;">Accept Invitation</a>
        </p>
        <p>Or copy and paste this link into your browser:</p>
        <p style="background-color: #f5f5f5; padding: 10px; word-break: break-all;">{{ invitation_url }}</p>
        <p style="font-size: 12px; color: #777; margin-top: 30px;">This invitation will expire in 7 days.</p>
    </div>
</body>
</html>
