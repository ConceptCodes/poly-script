[project]
name = "poly-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "poly-db",
    "poly-redis",
    "poly-stt",
    "poly-core",
    "fastapi[standard]>=0.127.0",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.21",
    "slowapi>=0.1.9",
    "stripe>=14.1.0",
    "uvicorn[standard]>=0.40.0",
    "sqlalchemy>=2.0.45",
    "sse-starlette>=3.1.2",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[tool.uv.sources]
poly-db = { path = "../../packages/storage/poly-db", editable = true }
poly-redis = { path = "../../packages/storage/redis", editable = true }
poly-stt = { path = "../../packages/stt", editable = true }
poly-core = { path = "../../packages/poly-core", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "DTZ",
    "T",
    "PGH",
    "PLC",
    "PIE",
    "SIM",
    "TID",
    "TCH",
    "ARG",
    "PTH",
    "PD",
    "ERA",
    "PLR",
    "FLY",
    "RUF",
]

ignore = [
    "E501",
    "PLR2004",
    "S101",
]

[tool.ruff.lint.isort]
known-first-party = ["poly-core", "poly-db", "poly-redis", "poly-stt"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "lf"
