[project]
name = "poly-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "poly-db",
    "poly-redis",
    "poly-stt",
    "poly-core",
    "fastapi[standard]>=0.127.0",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.21",
    "slowapi>=0.1.9",
    "stripe>=14.1.0",
    "uvicorn[standard]>=0.40.0",
    "sqlalchemy>=2.0.45",
    "sse-starlette>=3.1.2",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "requests>=2.31.0",
    "structlog>=24.2.0",
    "apscheduler>=3.10.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[tool.uv.sources]
poly-db = { workspace = true }
poly-redis = { workspace = true }
poly-stt = { workspace = true }
poly-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "DTZ",
    "T",
    "PGH",
    "PLC",
    "PIE",
    "SIM",
    "TID",
    "TCH",
    "ARG",
    "PTH",
    "PD",
    "ERA",
    "PLR",
    "FLY",
    "RUF",
]

ignore = [
    "E501",
    "PLR2004",
    "S101",
    "B008",  # FastAPI Depends pattern - false positive
    "B904",  # raise from None in FastAPI exception handlers - acceptable pattern
    "T201",  # print statements in CLI scripts
    "SIM117",  # nested with statements are sometimes clearer
    "TID252",  # relative imports are sometimes clearer
    "W293",  # minor formatting
    "PTH123",  # Path.open() is not always better
    "DTZ003",  # utcnow() is sometimes necessary
    "PLR0913",  # many function arguments
    "ARG002",  # unused arguments in callbacks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "PLC0415", "F821", "F841", "T201", "ERA001", "RUF043", "RUF059"]
"**/conftest.py" = ["ARG001", "ARG002"]
"packages/**" = ["T201", "TID252", "PLC0415"]
"src/routes/admin.py" = ["ARG001", "PLC0415", "SIM105", "F811"]
"src/routes/jobs.py" = ["ARG001", "PLC0415", "F821", "PLR0913"]
"src/routes/teams.py" = ["ARG001", "PLC0415"]
"src/routes/transcripts.py" = ["F841", "RUF059", "PLC0415"]
"src/routes/user.py" = ["PLC0415"]
"src/routes/webhooks.py" = ["PLC0415", "PLR0912", "PLR0915"]
"src/schemas/admin.py" = ["F821"]
"apps/worker/**" = ["PLC0415", "W293", "T201", "F841", "ARG001", "ARG002", "PTH110", "PTH108", "PTH122", "PLR0913", "SIM108", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["poly_core", "poly_db", "poly_redis", "poly_stt"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "lf"
