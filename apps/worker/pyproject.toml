[project]
name = "poly-worker"
version = "0.1.0"
description = "Background job processing worker with Redis queue"
requires-python = ">=3.11"
dependencies = [
  "redis>=5.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "sqlalchemy>=2.0.0",
  "faster-whisper>=1.0.0",
  "python-multipart>=0.0.6",
]

[project.scripts]
run = "python -m main"

[tool.ruff]
ignore = [
    "E501",
    "PLC0415",  # imports inside functions for lazy loading
    "T201",  # print statements for debugging
    "W293",  # minor whitespace issues
    "F841",  # unused variables sometimes needed for debugging
    "ARG001",  # unused arguments in callbacks
    "ARG002",  # unused arguments in test mocks
    "PTH110",  # Path.exists() pattern
    "PTH108",  # Path.unlink() pattern
    "PTH122",  # Path.suffix pattern
    "PLR0913",  # many function arguments
    "SIM108",  # ternary operator suggestion
    "F401",  # unused imports sometimes needed for type hints
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.14.10",
]
