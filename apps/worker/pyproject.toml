[project]
name = "poly-worker"
version = "0.1.0"
description = "Background job processing worker with Redis queue"
requires-python = ">=3.11"
dependencies = [
  "redis>=5.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "sqlalchemy>=2.0.0",
  "faster-whisper>=1.0.0",
  "python-multipart>=0.0.6",
]

[project.scripts]
run = "python -m main"

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.14.10",
]
